name: Publish images

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/jams-web
  WORKER_IMAGE: ghcr.io/${{ github.repository_owner }}/jams-worker

jobs:
  publish-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
      - name: Build web image
        run: >-
          docker build -f apps/web/Dockerfile
          -t ${{ env.WEB_IMAGE }}:${{ github.sha }}
          -t ${{ env.WEB_IMAGE }}:latest
          --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.CLERK_PUBLISHABLE_KEY }} .
      - name: Push web image
        run: |
          docker push ${{ env.WEB_IMAGE }}:${{ github.sha }}
          docker push ${{ env.WEB_IMAGE }}:latest

  publish-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
      - name: Build worker image
        run: >-
          docker build -f worker/Dockerfile
          -t ${{ env.WORKER_IMAGE }}:${{ github.sha }}
          -t ${{ env.WORKER_IMAGE }}:latest .
      - name: Push worker image
        run: |
          docker push ${{ env.WORKER_IMAGE }}:${{ github.sha }}
          docker push ${{ env.WORKER_IMAGE }}:latest
