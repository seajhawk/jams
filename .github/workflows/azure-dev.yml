# Run when commits are pushed to main
on:
  workflow_dispatch:
  push:
    # Run when commits are pushed to mainline branch (main or master)
    # Set this to the mainline branch you are using
    branches:
      - main

# Set up permissions for deploying with secretless Azure federated credentials
# https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure?tabs=azure-portal%2Clinux#set-up-azure-login-with-openid-connect-authentication
permissions:
  id-token: write
  contents: read


jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      SERVICE_WEB_IMAGE_NAME: ${{ vars.SERVICE_WEB_IMAGE_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      JAMS_PREVIEW_MAX_ANALYSES: ${{ vars.JAMS_PREVIEW_MAX_ANALYSES }}
      JAMS_PREVIEW_MAX_ACTIVE_RUNS: ${{ vars.JAMS_PREVIEW_MAX_ACTIVE_RUNS }}
      JAMS_PREVIEW_MAX_STORAGE_BYTES: ${{ vars.JAMS_PREVIEW_MAX_STORAGE_BYTES }}
      SERVICE_WORKER_IMAGE_NAME: ${{ vars.SERVICE_WORKER_IMAGE_NAME }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install azd
        uses: Azure/setup-azd@v2
      - name: Log in with Azure (Federated Credentials)
        run: |
          azd auth login `
            --client-id "$Env:AZURE_CLIENT_ID" `
            --federated-credential-provider "github" `
            --tenant-id "$Env:AZURE_TENANT_ID"
        shell: pwsh


      - name: Provision Infrastructure
        run: azd provision --no-prompt
        env:
          WATCHDOG_SECRET: ${{ secrets.WATCHDOG_SECRET }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          JAMS_WEB_DB_PASSWORD: ${{ secrets.JAMS_WEB_DB_PASSWORD }}
          JAMS_WORKER_DB_PASSWORD: ${{ secrets.JAMS_WORKER_DB_PASSWORD }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}

      - name: Deploy Application
        run: azd deploy --no-prompt
        env:
          WATCHDOG_SECRET: ${{ secrets.WATCHDOG_SECRET }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          JAMS_WEB_DB_PASSWORD: ${{ secrets.JAMS_WEB_DB_PASSWORD }}
          JAMS_WORKER_DB_PASSWORD: ${{ secrets.JAMS_WORKER_DB_PASSWORD }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
        
