name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jams
          POSTGRES_PASSWORD: jams
          POSTGRES_DB: jams
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jams -d jams"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://jams:jams@localhost:5432/jams
      DATABASE_URL_WEB: postgresql://jams_web:jams_web@localhost:5432/jams
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Lint
        run: pnpm lint

      - name: Audit dependencies
        run: pnpm audit
        working-directory: .

      - name: Migrate fresh integration database
        run: pnpm db:migrate

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Set up uv for worker database integration tests
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Verify worker storage writes against PostgreSQL deletion
        working-directory: .
        env:
          JAMS_TEST_DATABASE_URL: postgresql://jams:jams@localhost:5432/jams
        run: uv run --locked --project worker pytest worker/tests/test_artifact_write_integration.py -ra

  worker:
    name: Worker
    runs-on: ubuntu-latest
    env:
      # The accuracy gates must actually run here. Without these, every narrated, CV and
      # transcription gate skipped for a missing tool and the job still went green.
      JAMS_REQUIRE_FIXTURES: "1"
      JAMS_RUN_WHISPER_TESTS: "1"
      JAMS_WHISPER_MODEL_CACHE: ${{ github.workspace }}/.cache/whisper
    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v4

      - name: Install espeak-ng for narrated golden fixtures
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends espeak-ng

      - uses: pnpm/action-setup@v4

      - name: Set up Node.js for the CV fixture generator
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install CV fixture generator and Chromium
        working-directory: worker/scripts/make_cv_fixtures
        run: |
          pnpm install --ignore-workspace --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: .cache/whisper
          key: whisper-distil-small.en-v1

      - name: Prepare Whisper and sentiment models
        run: uv run python scripts/prepare_runtime.py

      - name: Lint
        run: uv run ruff check

      - name: Test
        run: uv run pytest -ra
